events {
    worker_connections 1024;
}

http {
    # ── Auth service upstream ─────────────────────────────────────────────────
    upstream auth {
        server auth-service:8083;
    }

    # ── User service upstream ─────────────────────────────────────────────────
    upstream user {
        server user-service:8084;
    }

    # ── Chat service upstream (Phase 4: standalone, own DB, 2 instances behind Redis fan-out) ──
    upstream backend {
        # ip_hash ensures same client always routes to same backend instance (WS stickiness).
        # ip_hash;
        server backend-1:8081;
        server backend-2:8082;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # ── Auth endpoints ────────────────────────────────────────────────────
        # No required trailing slash so /api/v1/auth and /api/v1/auth/... both match.
        location /api/v1/auth {
            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        # ── User endpoints ────────────────────────────────────────────────────
        # FE search hits GET /api/v1/users?search=... (no trailing slash). The old
        # /api/v1/users/ location missed that and fell through to Chat (301 → CORS).
        location /api/v1/users {
            proxy_pass http://user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }

        # ── WebSocket (Chat service) ───────────────────────────────────────────
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Chat + fallback REST ──────────────────────────────────────────────
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
