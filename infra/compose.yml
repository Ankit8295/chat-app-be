name: the-chat

services:
  # ──────────────────────────────────────────────────────────────────────────────
  # Databases (one per service — database-per-service pattern)
  # ──────────────────────────────────────────────────────────────────────────────

  # Chat service DB (conversations, messages)
  chat-postgres:
    image: postgres:17
    container_name: the-chat-chat-postgres
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chat_svc
      POSTGRES_PASSWORD: chat_password
    ports:
      - "5432:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_svc -d chat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth service DB (credentials)
  auth-postgres:
    image: postgres:17
    container_name: the-chat-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User service DB (profiles, friendships, preferences)
  user-postgres:
    image: postgres:17
    container_name: the-chat-user-postgres
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_password
    ports:
      - "5434:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: the-chat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────────
  # Auth Service (Phase 2)
  # ──────────────────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.auth
    container_name: the-chat-auth-service
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://auth-postgres:5432/auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      JWT_REFRESH_TOKEN_TTL: P30D
      SERVICE_JWT_ISSUER: the-chat-internal
      SERVICE_JWT_SECRET: replace-this-dummy-service-secret-with-at-least-32-chars
      SERVICE_JWT_TTL: PT1M
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      USER_SERVICE_BASE_URL: http://user-service:8084
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "8083:8083"

  # ──────────────────────────────────────────────────────────────────────────────
  # User Service (Phase 3)
  # ──────────────────────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.user
    container_name: the-chat-user-service
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://user-postgres:5432/user_db
      DB_USERNAME: user_svc
      DB_PASSWORD: user_password
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      JWT_REFRESH_TOKEN_TTL: P30D
      SERVICE_JWT_ISSUER: the-chat-internal
      SERVICE_JWT_SECRET: replace-this-dummy-service-secret-with-at-least-32-chars
      SERVICE_JWT_TTL: PT1M
    depends_on:
      user-postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  # ──────────────────────────────────────────────────────────────────────────────
  # Chat Service (Phase 4) — standalone, own DB, WS + Redis fan-out across instances
  # ──────────────────────────────────────────────────────────────────────────────

  backend-1:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.chat
    container_name: the-chat-backend-1
    environment:
      SERVER_PORT: 8081
      INSTANCE_ID: "1"
      DB_URL: jdbc:postgresql://chat-postgres:5432/chat_db
      DB_USERNAME: chat_svc
      DB_PASSWORD: chat_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      SERVICE_JWT_ISSUER: the-chat-internal
      SERVICE_JWT_SECRET: replace-this-dummy-service-secret-with-at-least-32-chars
      SERVICE_JWT_TTL: PT1M
      SPRING_FLYWAY_ENABLED: "true"
      USER_SERVICE_BASE_URL: http://user-service:8084
    depends_on:
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    ports:
      - "8081:8081"

  backend-2:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.chat
    container_name: the-chat-backend-2
    environment:
      SERVER_PORT: 8082
      INSTANCE_ID: "2"
      DB_URL: jdbc:postgresql://chat-postgres:5432/chat_db
      DB_USERNAME: chat_svc
      DB_PASSWORD: chat_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      SERVICE_JWT_ISSUER: the-chat-internal
      SERVICE_JWT_SECRET: replace-this-dummy-service-secret-with-at-least-32-chars
      SERVICE_JWT_TTL: PT1M
      SPRING_FLYWAY_ENABLED: "false"
      USER_SERVICE_BASE_URL: http://user-service:8084
    depends_on:
      chat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-1:
        condition: service_started
    ports:
      - "8082:8082"

  nginx:
    image: nginx:alpine
    container_name: the-chat-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service
      - backend-1
      - backend-2

volumes:
  chat_postgres_data:
  auth_postgres_data:
  user_postgres_data:
