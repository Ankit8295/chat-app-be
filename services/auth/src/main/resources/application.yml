server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  services:
    user:
      # Base URL of the User service — used for the register saga (profile creation HTTP call)
      base-url: ${USER_SERVICE_BASE_URL:http://localhost:8080}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:access_token}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:the-chat-api}
    secret: ${JWT_SECRET:replace-this-dummy-secret-with-at-least-32-characters}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  service-jwt:
    # Separate secret from app.jwt — signs the short-lived service-identity token this service
    # (as a caller) attaches to every outgoing call to User's /internal/** routes.
    issuer: ${SERVICE_JWT_ISSUER:the-chat-internal}
    secret: ${SERVICE_JWT_SECRET:replace-this-dummy-service-secret-with-at-least-32-chars}
    ttl: ${SERVICE_JWT_TTL:PT1M}
