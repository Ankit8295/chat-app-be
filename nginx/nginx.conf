events {
    worker_connections 1024;
}

http {
    upstream backend {
        # ip_hash ensures same client IP always routes to same backend instance.
        # Remove this line to test round-robin (exposes the cross-instance WS failure).
        # ip_hash;

        server backend-1:8081;
        server backend-2:8082;
        # Add more servers here when scaling (e.g. server backend-3:8083;)
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;

        # WebSocket endpoint — needs Upgrade headers and long timeout
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API — standard reverse proxy
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
