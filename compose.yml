services:
  postgres:
    image: postgres:17
    container_name: the-chat-postgres
    environment:
      POSTGRES_DB: the_chat
      POSTGRES_USER: the_chat_user
      POSTGRES_PASSWORD: the_chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_chat_user -d the_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
