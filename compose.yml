services:
  postgres:
    image: postgres:17
    container_name: the-chat-postgres
    environment:
      POSTGRES_DB: the_chat
      POSTGRES_USER: the_chat_user
      POSTGRES_PASSWORD: the_chat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_chat_user -d the_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: the-chat-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-chat-backend-1
    environment:
      SERVER_PORT: 8081
      INSTANCE_ID: "1"
      DB_URL: jdbc:postgresql://postgres:5432/the_chat
      DB_USERNAME: the_chat_user
      DB_PASSWORD: the_chat_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-chat-backend-2
    environment:
      SERVER_PORT: 8082
      INSTANCE_ID: "2"
      DB_URL: jdbc:postgresql://postgres:5432/the_chat
      DB_USERNAME: the_chat_user
      DB_PASSWORD: the_chat_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: Lax
      AUTH_COOKIE_PATH: /
      JWT_ISSUER: the-chat-api
      JWT_SECRET: replace-this-dummy-secret-with-at-least-32-characters
      JWT_ACCESS_TOKEN_TTL: PT15M
      SPRING_FLYWAY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-1:
        condition: service_started
    ports:
      - "8082:8082"

  nginx:
    image: nginx:alpine
    container_name: the-chat-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2

volumes:
  postgres_data:
